# OPTIONAL rehearsal override - simulated routers instead of GNS3. NOT for the exam demo.
#   docker compose -f docker-compose.yml -f docker-compose.sim.yml up -d --build
# Then use the UI exactly as in the demo. Switch back with a plain `docker compose up -d`.
services:
  routersim:
    build:
      context: ./tests
      dockerfile: sim/Dockerfile
    environment:
      SIM_USERNAME: ${ROUTER_SSH_USERNAME}
      SIM_PASSWORD: ${ROUTER_SSH_PASSWORD}
    restart: unless-stopped

  backend:
    volumes:
      - ./inventory/devices.sim.yaml:/config/devices.yaml:ro

  worker:
    depends_on:
      routersim:
        condition: service_started
    volumes:
      - ./inventory/devices.sim.yaml:/config/devices.yaml:ro
